    // document mints the blobs for its OWN frames, obtaining page text

    // its direct parent (which, for every document the publisher's own

    // "page text" from it, minting attacker HTML as an artifact-origin

    // an origin exists), and both directions are origin-gated (on https

    // contexts such as a sandboxed preview iframe) — location.origin is

      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

    // local text and treats a miss as authoritative — never relaying to

      ';</' + 'script>';

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;

        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

      const s = document.createElement('script');

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

      window.Babel.transformScriptTags();

    console.error('Bundle unpack error:', err);

2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"189a5071-c9d1-4b0c-8a99-43e7f50a57b8\"><\u002Fscript>\n<script src=\"d393f06f-7459-4b9a-aa09-b25fb9991145\"><\u002Fscript>\n<style>/* ===================================================================\n   Blickdoktor website — page styles\n   Built on tokens from ../../colors_and_type.css\n   =================================================================== */\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody {\n  background: var(--bd-bg);\n  color: var(--fg-1);\n  font-family: var(--font-sans);\n  font-size: 16px;\n  line-height: 1.5;\n}\n\nimg, svg { display: block; max-width: 100%; }\nbutton { font: inherit; cursor: pointer; }\nul { margin: 0; padding: 0; list-style: none; }\n\n.container { max-width: var(--container); margin: 0 auto; padding: 0 32px; }\n.container-narrow { max-width: var(--container-narrow); margin: 0 auto; padding: 0 32px; }\n\n.section { padding: 96px 0; }\n.section-tight { padding: 64px 0; }\n.section-bg-alt { background: var(--bd-bg-2); }\n.section-bg-deep { background: var(--bd-blue-900); color: #F6F2EB; }\n\n/* ---- Buttons ---- */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n  font-family: var(--font-sans); font-size: 15px; font-weight: 500;\n  line-height: 1; letter-spacing: -0.005em;\n  padding: 13px 22px; border-radius: var(--r-md);\n  border: 1px solid transparent; background: none; color: inherit;\n  transition: background var(--dur-base) var(--ease-standard),\n              color var(--dur-base) var(--ease-standard),\n              border-color var(--dur-base) var(--ease-standard),\n              transform var(--dur-fast) var(--ease-standard);\n  text-decoration: none;\n}\n.btn:active { transform: translateY(1px); }\n.btn .lucide { width: 18px; height: 18px; }\n.btn-sm  { padding: 9px 14px; font-size: 13.5px; }\n.btn-lg  { padding: 16px 26px; font-size: 16px; }\n.btn-primary    { background: var(--bd-blue-700); color: #F6F2EB; }\n.btn-primary:hover    { background: var(--bd-blue-800); }\n.btn-primary:disabled { background: var(--bd-blue-300); cursor: not-allowed; }\n.btn-secondary  { background: var(--bd-surface); color: var(--bd-blue-800); border-color: var(--bd-line); }\n.btn-secondary:hover  { background: var(--bd-blue-50); border-color: var(--bd-blue-100); }\n.btn-ghost      { color: var(--bd-blue-800); }\n.btn-ghost:hover{ background: var(--bd-blue-50); }\n.btn-accent     { background: var(--bd-clay-600); color: #F6F2EB; }\n.btn-accent:hover{ background: var(--bd-clay-700); }\n.btn-on-dark    { background: #F6F2EB; color: var(--bd-blue-900); }\n.btn-on-dark:hover { background: #fff; }\n\n/* ---- Inputs ---- */\n.field { display: flex; flex-direction: column; gap: 6px; }\n.field label { font-size: 13px; font-weight: 500; color: var(--fg-2); }\n.input, .select, .textarea {\n  background: var(--bd-surface); border: 1px solid var(--bd-line);\n  border-radius: var(--r-md); padding: 12px 14px;\n  font: inherit; font-size: 15px; color: var(--fg-1); width: 100%;\n  transition: border-color var(--dur-base), box-shadow var(--dur-base);\n}\n.input:focus, .select:focus, .textarea:focus {\n  outline: none; border-color: var(--bd-blue-700); box-shadow: var(--shadow-focus);\n}\n.input::placeholder { color: var(--fg-4); }\n\n/* ---- Badge ---- */\n.badge {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-size: 12.5px; font-weight: 500; line-height: 1;\n  padding: 6px 10px; border-radius: var(--r-pill);\n  background: var(--bd-blue-50); color: var(--bd-blue-800);\n}\n.badge-sage  { background: var(--bd-sage-50);  color: var(--bd-sage-700); }\n.badge-clay  { background: var(--bd-clay-50);  color: var(--bd-clay-700); }\n.badge-line  { background: var(--bd-surface); color: var(--bd-ink-2); border: 1px solid var(--bd-line); }\n\n/* ---- Card ---- */\n.card {\n  background: var(--bd-surface); border: 1px solid var(--bd-line);\n  border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-1);\n}\n.card-quiet { background: var(--bd-bg-2); border-color: transparent; box-shadow: none; }\n.card-interactive { cursor: pointer; transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard); }\n.card-interactive:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }\n\n/* ---- Eyebrow + section headers ---- */\n.section-head { display: flex; flex-direction: column; gap: 14px; max-width: 640px; }\n.section-head .eyebrow { color: var(--bd-sage-700); }\n.section-head h2 { margin: 0; font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; font-family: var(--font-serif); font-weight: 400; }\n.section-head p  { margin: 0; color: var(--fg-2); font-size: 17px; line-height: 1.5; }\n\n/* ---- Modal ---- */\n.modal-overlay {\n  position: fixed; inset: 0; background: rgba(22,52,76,0.45);\n  display: flex; align-items: center; justify-content: center;\n  z-index: 50; padding: 24px;\n  animation: fadeIn var(--dur-base) var(--ease-standard);\n}\n@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }\n.modal {\n  background: var(--bd-bg); border-radius: var(--r-xl);\n  width: 100%; max-width: 520px; max-height: calc(100vh - 48px); overflow: auto;\n  box-shadow: var(--shadow-3);\n  animation: slideUp var(--dur-slow) var(--ease-standard);\n}\n\n/* ---- Drawer (booking variant B) ---- */\n.drawer-overlay { position: fixed; inset: 0; background: rgba(22,52,76,0.35); z-index: 50; animation: fadeIn var(--dur-base); }\n.drawer {\n  position: fixed; top: 0; right: 0; bottom: 0; z-index: 51;\n  width: min(520px, 100vw); background: var(--bd-bg);\n  box-shadow: -8px 0 24px rgba(22,52,76,0.12); overflow: auto;\n  animation: slideInRight var(--dur-slow) var(--ease-standard);\n}\n@keyframes slideInRight { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }\n\n/* ---- Fullscreen (booking variant C) ---- */\n.fullscreen-take {\n  position: fixed; inset: 0; background: var(--bd-bg); z-index: 60;\n  overflow: auto;\n  animation: fadeIn var(--dur-base) var(--ease-standard);\n}\n\n/* ---- Utilities ---- */\n.stack-2  { display: flex; flex-direction: column; gap: 8px; }\n.stack-3  { display: flex; flex-direction: column; gap: 12px; }\n.stack-4  { display: flex; flex-direction: column; gap: 16px; }\n.stack-6  { display: flex; flex-direction: column; gap: 24px; }\n.stack-8  { display: flex; flex-direction: column; gap: 32px; }\n.stack-12 { display: flex; flex-direction: column; gap: 48px; }\n.row { display: flex; gap: 16px; align-items: center; }\n.row-tight { display: flex; gap: 8px; align-items: center; }\n.row-wrap { display: flex; gap: 12px; flex-wrap: wrap; }\n.spread { display: flex; align-items: center; justify-content: space-between; gap: 16px; }\n.muted { color: var(--fg-3); }\n.center { text-align: center; }\n\n/* ---- Lucide icon sizing default ---- */\n.icon-16 { width: 16px; height: 16px; }\n.icon-20 { width: 20px; height: 20px; }\n.icon-24 { width: 24px; height: 24px; }\n<\u002Fstyle>\n<style>\n*,*::before,*::after{box-sizing:border-box}\nhtml,body{margin:0;overflow-x:hidden}\nbody{background:#F6F2EB;color:#1B2530;font-family:'Geist',-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}\na{color:#2A5470;text-underline-offset:3px}\na:hover{color:#16344C}\n::selection{background:#EFDDCF;color:#1B2530}\n[data-bd-icon]{display:inline-flex;align-items:center;flex-shrink:0;line-height:0}\n@media(max-width:768px){\n.eg-hero-grid{grid-template-columns:1fr!important}\n.eg-hero-grid>*:last-child{display:none}\n.eg-hero-title{font-size:36px!important}\n.eg-hero-btns{flex-wrap:wrap!important}\n.eg-trust{grid-template-columns:1fr!important}\n.eg-how{grid-template-columns:1fr!important}\n.eg-cond{grid-template-columns:1fr!important}\n.eg-docs{grid xt-decoration: none\">Book appointment <span data-bd-icon=\"arrow-right\" data-bd-size=\"18\" data-bd-color=\"#F6F2EB\"><\u002Fspan><\u002Fa>\n<a href=\"#how\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; padding: 16px 26px; border-radius: 10px; color: #1F4760; text-decoration: none\"><span data-bd-icon=\"play\" data-bd-size=\"18\" data-bd-color=\"#1F4760\"><\u002Fspan>How it works<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; margin-top: 16px; align-items: center\">\n<span data-bd-icon=\"clock\" data-bd-size=\"16\" data-bd-color=\"#4F7A5B\"><\u002Fspan>\n<span style=\"font-size: 13px; color: #5A6571\">Call back typically within 30 minutes<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n{{ heroAnimation }}\n<\u002Fdiv>\n<\u002Fsection>\n<section style=\"padding: 32px 0; border-top: 1px solid #EFEAE0; border-bottom: 1px solid #EFEAE0; background: #EFE9DD\">\n<div class=\"eg-trust\" style=\"max-width: 1200px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px\">\n<div style=\"display: flex; gap: 12px; align-items: center\"><span data-bd-icon=\"shield-check\" data-bd-size=\"20\" data-bd-color=\"#2A5470\"><\u002Fspan><span style=\"font-size: 14px; color: #3A4754\">Licensed ophthalmologists in Germany<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\"><span data-bd-icon=\"lock\" data-bd-size=\"20\" data-bd-color=\"#2A5470\"><\u002Fspan><span style=\"font-size: 14px; color: #3A4754\">GDPR-compliant · Servers in Germany<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\"><span data-bd-icon=\"clock\" data-bd-size=\"20\" data-bd-color=\"#2A5470\"><\u002Fspan><span style=\"font-size: 14px; color: #3A4754\">Call back in minutes<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"how\" style=\"padding: 96px 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 32px\">\n<div style=\"di
