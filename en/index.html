  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

      #1B2530;   /* primary text */\n  --bd-ink-2:    #3A4754;   /* secondary text */\n  --bd-ink-3:    #5A6571;   /* tertiary / meta */\n  --bd-ink-4:    #8A929B;   /* placeholder, disabled label */\n  --bd-line:     #E5DFD4;   /* hairline border (warm) */\n  --bd-line-2:   #EFEAE0;   /* subtler line */\n  --bd-surface:  #FFFFFF;   /* card surface */\n  --bd-bg:       #F6F2EB;   /* page bg, warm off-white */\n  --bd-bg-2:     #EFE9DD;   /* alt section bg */\n  --bd-bg-3:     #E8E1D2;   /* deeper alt */\n\n  /* Semantic */\n  --bd-success:    #4F7A5B;\n  --bd-success-bg: #E4EDE5;\n  --bd-warning:    #B0823A;\n  --bd-warning-bg: #F4EAD5;\n  --bd-danger:     #A4493C;\n  --bd-danger-bg:  #F2DCD6;\n  --bd-info:       var(--bd-blue-700);\n  --bd-info-bg:    var(--bd-blue-50);\n\n  /* Semantic foreground / background */\n  --fg-1: var(--bd-ink);\n  --fg-2: var(--bd-ink-2);\n  --fg-3: var(--bd-ink-3);\n  --fg-4: var(--bd-ink-4);\n  --fg-on-brand: #F6F2EB;\n\n  --bg-1: var(--bd-bg);\n  --bg-2: var(--bd-bg-2);\n  --surface-1: var(--bd-surface);\n  --brand: var(--bd-blue-700);\n  --brand-strong: var(--bd-blue-900);\n  --accent: var(--bd-clay-600);\n  --calm: var(--bd-sage-600);\n\n  /* ============ Type ============ */\n  /* Single family. --font-serif kept as an alias for backward compat\n     but resolves to Geist \u2014 there is no serif in the system. */\n  --font-display: \"Geist\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif;\n  --font-sans:    \"Geist\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif;\n  --font-serif:   var(--font-display);\n  --font-mono:    \"Geist Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Type scale (rem-based) */\n  --t-display-xl: 4.5rem;   /* 72 */\n  --t-display-l:  3.5rem;   /* 56 */\n  --t-display-m:  2.75rem;  /* 44 */\n  --t-h1:         2.25rem;  /* 36 */\n  --t-h2:         1.75rem;  /* 28 */\n  --t-h3:         1.375rem; /* 22 */\n  --t-h4:         1.125rem; /* 18 */\n  --t-body:       1rem;     /* 16 */\n  --t-body-sm:    0.875rem; /* 14 */\n  --t-meta:       0.8125rem;/* 13 */\n  --t-micro:      0.75rem;  /* 12 */\n\n  --lh-tight:   1.08;\n  --lh-snug:    1.2;\n  --lh-normal:  1.5;\n  --lh-loose:   1.65;\n\n  --ls-tight:   -0.02em;\n  --ls-snug:    -0.01em;\n  --ls-normal:  0;\n  --ls-wide:    0.04em;\n  --ls-eyebrow: 0.14em;\n\n  /* ============ Radius ============ */\n  --r-xs:  4px;\n  --r-sm:  6px;\n  --r-md:  10px;\n  --r-lg:  14px;\n  --r-xl:  20px;\n  --r-2xl: 28px;\n  --r-pill: 999px;\n\n  /* ============ Spacing ============ */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n\n  /* ============ Elevation ============ */\n  --shadow-0: none;\n  --shadow-1: 0 1px 2px rgba(27, 37, 48, 0.04), 0 1px 1px rgba(27, 37, 48, 0.03);\n  --shadow-2: 0 2px 4px rgba(27, 37, 48, 0.05), 0 4px 12px rgba(27, 37, 48, 0.04);\n  --shadow-3: 0 6px 16px rgba(27, 37, 48, 0.06), 0 12px 32px rgba(27, 37, 48, 0.05);\n  --shadow-focus: 0 0 0 3px rgba(42, 84, 112, 0.18);\n\n  /* ============ Motion ============ */\n  --ease-standard: cubic-bezier(0.2, 0.6, 0.2, 1);\n  --ease-gentle:   cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast:   140ms;\n  --dur-base:   220ms;\n  --dur-slow:   420ms;\n\n  /* ============ Layout ============ */\n  --container: 1200px;\n  --container-narrow: 880px;\n}\n\n/* ---------- Semantic element styles ----------------------------------- */\nhtml, body {\n  background: var(--bg-1);\n  color: var(--fg-1);\n  font-family: var(--font-sans);\n  font-size: var(--t-body);\n  line-height: var(--lh-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n.display-xl, .display-l, .display-m,\nh1, h2, h3 {\n  font-family: var(--font-display);\n  font-weight: 500;\n  letter-spacing: var(--ls-tight);\n  line-height: var(--lh-tight);\n  color: var(--fg-1);\n  text-wrap: pretty;\n}\n\n.display-xl { font-size: var(--t-display-xl); }\n.display-l  { font-size: var(--t-display-l);  }\n.display-m  { font-size: var(--t-display-m);  }\n\nh1 { font-size: var(--t-h1); line-height: var(--lh-snug); }\nh2 { font-size: var(--t-h2); line-height: var(--lh-snug); }\nh3 { font-size: var(--t-h3); line-height: var(--lh-snug); letter-spacing: var(--ls-snug); }\nh4 {\n  font-family: var(--font-sans);\n  font-size: var(--t-h4);\n  font-weight: 500;\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-snug);\n}\n\np, .body {\n  font-size: var(--t-body);\n  line-height: var(--lh-loose);\n  color: var(--fg-2);\n  text-wrap: pretty;\n}\n\n.lead {\n  font-family: var(--font-display);\n  font-size: 1.25rem;\n  line-height: var(--lh-normal);\n  color: var(--fg-2);\n  font-weight: 400;\n}\n\n.meta {\n  font-size: var(--t-meta);\n  color: var(--fg-3);\n  letter-spacing: var(--ls-snug);\n}\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-size: var(--t-micro);\n  font-weight: 500;\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--fg-3);\n}\n\ncode, .mono {\n  font-family: var(--font-mono);\n  font-size: 0.9em;\n  color: var(--fg-2);\n}\n\n.serif-italic {\n  /* Legacy hook \u2014 retained for backward compat with existing markup.\n     Now resolves to Geist italic (medium) so it still reads as an\n     emphasised aside without introducing a serif. */\n  font-family: var(--font-display);\n  font-style: italic;\n  font-weight: 500;\n  color: var(--brand);\n}\n\na { color: var(--brand); text-underline-offset: 3px; text-decoration-thickness: 1px; }\na:hover { color: var(--brand-strong); }\n\n::selection { background: var(--bd-clay-100); color: var(--bd-ink); }\n\n/* ---------- Mobile overrides ------------------------------------------ */\n@media (max-width: 767px) {\n  :root {\n    --t-display-xl: 2.75rem;\n    --t-display-l:  2.25rem;\n    --t-display-m:  2rem;\n    --t-h1:         1.75rem;\n    --t-h2:         1.5rem;\n  }\n}\n<\u002Fstyle>\n  <style>/* ===================================================================\n   Blickdoktor website \u2014 page styles\n   Built on tokens from ../../colors_and_type.css\n   =================================================================== */\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody {\n  background: var(--bd-bg);\n  color: var(--fg-1);\n  font-family: var(--font-sans);\n  font-size: 16px;\n  line-height: 1.5;\n}\n\nimg, svg { display: block; max-width: 100%; }\nbutton { font: inherit; cursor: pointer; }\nul { margin: 0; padding: 0; list-style: none; }\n\n.container { max-width: var(--container); margin: 0 auto; padding: 0 32px; }\n.container-narrow { max-width: var(--container-narrow); margin: 0 auto; padding: 0 32px; }\n\n.section { padding: 96px 0; }\n.section-tight { padding: 64px 0; }\n.section-bg-alt { background: var(--bd-bg-2); }\n.section-bg-deep { background: var(--bd-blue-900); color: #F6F2EB; }\n\n/* ---- Buttons ---- */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n  font-family: var(--font-sans); font-size: 15px; font-weight: 500;\n  line-height: 1; letter-spacing: -0.005em;\n  padding: 13px 22px; border-radius: var(--r-md);\n  border: 1px solid transparent; background: none; color: inherit;\n  transition: background var(--dur-base) var(--ease-standard),\n              color var(--dur-base) var(--ease-standard),\n              border-color var(--dur-base) var(--ease-standard),\n              transform var(--dur-fast) var(--ease-standard);\n  text-decoration: none;\n}\n.btn:active { transform: translateY(1px); }\n.btn .lucide { width: 18px; height: 18px; }\n.btn-sm  { padding: 9px 14px; font-size: 13.5px; }\n.btn-lg  { padding: 16px 26px; font-size: 16px; }\n.btn-primary    { background: var(--bd-blue-700); color: #F6F2EB; }\n.btn-primary:hover    { background: var(--bd-blue-800); }\n.btn-primary:disabled { background: var(--bd-blue-300); cursor: not-allowed; }\n.btn-secondary  { background: var(--bd-surface); color: var(--bd-blue-800); border-color: var(--bd-line); }\n.btn-secondary:hover  { background: var(--bd-blue-50); border-color: var(--bd-blue-100); }\n.btn-ghost      { color: var(--bd-blue-800); }\n.btn-ghost:hover{ background: var(--bd-blue-50); }\n.btn-accent     { background: var(--bd-clay-600); color: #F6F2EB; }\n.btn-accent:hover{ background: var(--bd-clay-700); }\n.btn-on-dark    { background: #F6F2EB; color: var(--bd-blue-900); }\n.btn-on-dark:hover { background: #fff; }\n\n/* ---- Inputs ---- */\n.field { display: flex; flex-direction: column; gap: 6px; }\n.field label { font-size: 13px; font-weight: 500; color: var(--fg-2); }\n.input, .select, .textarea {\n  background: var(--bd-surface); border: 1px solid var(--bd-line);\n  border-radius: var(--r-md); padding: 12px 14px;\n  font: inherit; font-size: 15px; color: var(--fg-1); width: 100%;\n  transition: border-color var(--dur-base), box-shadow var(--dur-base);\n}\n.input:focus, .select:focus, .textarea:focus {\n  outline: none; border-color: var(--bd-blue-700); box-shadow: var(--shadow-focus);\n}\n.input::placeholder { color: var(--fg-4); }\n\n/* ---- Badge ---- */\n.badge {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-size: 12.5px; font-weight: 500; line-height: 1;\n  padding: 6px 10px; border-radius: var(--r-pill);\n  background: var(--bd-blue-50); color: var(--bd-blue-800);\n}\n.badge-sage  { background: var(--bd-sage-50);  color: var(--bd-sage-700); }\n.badge-clay  { background: var(--bd-clay-50);  color: var(--bd-clay-700); }\n.badge-line  { background: var(--bd-surface); color: var(--bd-ink-2); border: 1px solid var(--bd-line); }\n\n/* ---- Card ---- */\n.card {\n  background: var(--bd-surface); border: 1px solid var(--bd-line);\n  border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-1);\n}\n.card-quiet { background: var(--bd-bg-2); border-color: transparent; box-shadow: none; }\n.card-interactive { cursor: pointer; transition: box-shadow var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard); }\n.card-interactive:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }\n\n/* ---- Eyebrow + section headers ---- */\n.section-head { display: flex; flex-direction: column; gap: 14px; max-width: 640px; }\n.section-head .eyebrow { color: var(--bd-sage-700); }\n.section-head h2 { margin: 0; font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; font-family: var(--font-serif); font-weight: 400; }\n.section-head p  { margin: 0; color: var(--fg-2); font-size: 17px; line-height: 1.5; }\n\n/* ---- Modal ---- */\n.modal-overlay {\n  position: fixed; inset: 0; background: rgba(22,52,76,0.45);\n  display: flex; align-items: center; justify-content: center;\n  z-index: 50; padding: 24px;\n  animation: fadeIn var(--dur-base) var(--ease-standard);\n}\n@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }\n.modal {\n  background: var(--bd-bg); border-radius: var(--r-xl);\n  width: 100%; max-width: 520px; max-height: calc(100vh - 48px); overflow: auto;\n  box-shadow: var(--shadow-3);\n  animation: slideUp var(--dur-slow) var(--ease-standard);\n}\n\n/* ---- Drawer (booking variant B) ---- */\n.drawer-overlay { position: fixed; inset: 0; background: rgba(22,52,76,0.35); z-index: 50; animation: fadeIn var(--dur-base); }\n.drawer {\n  position: fixed; top: 0; right: 0; bottom: 0; z-index: 51;\n  width: min(520px, 100vw); background: var(--bd-bg);\n  box-shadow: -8px 0 24px rgba(22,52,76,0.12); overflow: auto;\n  animation: slideInRight var(--dur-slow) var(--ease-standard);\n}\n@keyframes slideInRight { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }\n\n/* ---- Fullscreen (booking variant C) ---- */\n.fullscreen-take {\n  position: fixed; inset: 0; backgro lor: var(--bd-success);\">{{ iClock16 }}<\u002Fspan>\n          <span style=\"font-size: 13px; color: var(--fg-3);\">Call back typically within 30 minutes<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"aspect-ratio: 4/5; border-radius: var(--r-2xl); overflow: hidden; background: var(--bd-sage-50); display: flex; align-items: center; justify-content: center;\">\n      <svg sc-camel-view-box=\"0 0 400 500\" style=\"width: 100%; height: 100%;\" xmlns=\"http://www.w3.org/2000/svg\">\n        <rect width=\"400\" height=\"500\" fill=\"#ECEFE8\"><\u002Frect>\n        <g transform=\"translate(0,50)\">\n          <path d=\"M70 200 C 140 130, 260 130, 330 200 C 260 270, 140 270, 70 200 Z\" fill=\"none\" stroke=\"#2A5470\" stroke-width=\"2.5\" opacity=\"0.25\"><\u002Fpath>\n          <circle cx=\"200\" cy=\"200\" r=\"50\" fill=\"#2A5470\" opacity=\"0.15\"><\u002Fcircle>\n          <circle cx=\"200\" cy=\"200\" r=\"20\" fill=\"#2A5470\" opacity=\"0.3\"><\u002Fcircle>\n          <circle cx=\"196\" cy=\"196\" r=\"5\" fill=\"#F6F2EB\" opacity=\"0.7\"><\u002Fcircle>\n        <\u002Fg>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- TRUST STRIP -->\n<section id=\"trust\" style=\"background: var(--bd-bg-2); padding: 32px 0; border-top: 1px solid var(--bd-line-2); border-bottom: 1px solid var(--bd-line-2);\">\n  <div style=\"max-width: var(--container); margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;\">\n    <div style=\"display: flex; gap: 12px; align-items: center;\">\n      <span style=\"color: var(--bd-blue-700);\">{{ iShieldCheck20 }}<\u002Fspan>\n      <span style=\"font-size: 14px; color: var(--fg-2);\">Licensed ophthalmologists in Germany<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 12px; align-items: center;\">\n      <span style=\"color: var(--bd-blue-700);\">{{ iLock20 }}<\u002Fspan>\n      <span style=\"font-size: 14px; color: var(--fg p style=\"margin: 0; color: var(--fg-2); font-size: 15px;\">Answer a few questions about your complaint in 3 minutes. Upload a photo if needed.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"background: var(--bd-bg-2); border-color: transparent; box-shadow: none; padding: 32px;\">\n        <div style=\"display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px;\">\n          <span style=\"font-family: var(--font-mono); font-size: 13px; color: var(--bd-sage-700); letter-spacing: 0.04em;\">02<\u002Fspan>\n          <span style=\"width: 44px; height: 44px; border-radius: var(--r-pill); background: var(--bd-blue-700); color: #F6F2EB; display: flex; align-items: center; justify-content: center;\">{{ iCalendar }}<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0 0 8px; font-size: 22px;\">Choose a time slot<\u002Fh3>\n        <p style=\"margin: 0; color: var(--fg-2); font-size: 15px;\">Select a convenient appointment \u2014 usually available the same day.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"background: var(--bd-bg-2); border-color: transparent; box-shadow: none; padding: 32px;\">\n        <div style=\"display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px;\">\n          <span style=\"font-family: var(--font-mono); font-size: 13px; color: var(--bd-sage-700); letter-spacing: 0.04em;\">03<\u002Fspan>\n          <span style=\"width: 44px; height: 44px; border-radius: var(--r-pill); background: var(--bd-blue-700); color: #F6F2EB; display: flex; align-items: center; justify-content: center;\">{{ iPhone }}<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0 0 8px; font-size: 22px;\">Doctor calls you<\u002Fh3>\n        <p style=\"margin: 0; color: var(--fg-2); font-size: 15px;\">The doctor calls you at your chosen time to discuss your concern with you. Afterwards you receive a medical report and, if medically indicated, a prescription.<\u002Fp> -items: flex-start; justify-content: space-between; margin-bottom: 16px;\">\n          <span style=\"width: 40px; height: 40px; border-radius: var(--r-md); background: var(--bd-sage-50); color: var(--bd-sage-700); display: flex; align-items: center; justify-content: center;\">{{ iBaby }}<\u002Fspan>\n          <span style=\"font-family: var(--font-mono); font-size: 13px; color: var(--fg-3);\">37,54 \u20ac<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0 0 6px; font-size: 20px;\">General consultation<\u002Fh3>\n        <p style=\"margin: 0; color: var(--fg-2); font-size: 14.5px; line-height: 1.55;\">Any other eye-related concern \u2014 we are happy to help.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- Emergency notice -->\n    <div style=\"margin-top: 32px; display: flex; gap: 16px; padding: 18px 22px; background: var(--bd-warning-bg); border-radius: var(--r-lg); align-items: flex-start;\">\n      <span style=\"width: 36px; height: 36px; border-radius: 999px; flex: none; background: rgba(255,255,255,0.6); color: var(--bd-warning); display: inline-flex; align-items: center; justify-content: center;\">{{ iAlert }}<\u002Fspan>\n      <div style=\"flex: 1;\">\n        <strong style=\"font-size: 15.5px; color: var(--bd-warning); font-weight: 600;\">Acute symptoms or emergency?<\u002Fstrong>\n        <p style=\"margin: 6px 0 0; font-size: 14px; color: var(--bd-warning); line-height: 1.55; max-width: 720px;\">\n          For sudden vision loss, double vision, or severe pain, please contact <strong>112<\u002Fstrong> and your nearest ophthalmology emergency department.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- DOCTOR \u2014 Only Dr. Evrim Oehmichen -->\n<section id=\"team\" style=\"padding: 96px 0; background: var(--bd-bg-2);\">\n  <div style=\"max-width: var(--container); margin: 0 auto; padding: 0 32px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 640px; margin-bottom: 48px;\">\n      <span style=\"font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3);\">Our doctor<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; font-family: var(--font-display); font-weight: 500;\">Licensed ophthalmologists in Germany<br><span style=\"color: var(--bd-sage-700); font-style: italic;\">who listen.<\u002Fspan><\u002Fh2>\n      <p style=\"margin: 0; color: var(--fg-2); font-size: 17px; line-height: 1.5;\">All treating physicians are licensed in Germany and have been professionally vetted multiple times. You choose your doctor yourself.<\u002Fp>\n    <\u002Fdiv>\n    <div data-r=\"doctor\" style=\"display: grid; grid-template-columns: 1fr 1.5fr; gap: 48px; align-items: start;\">\n      <div class=\"card\" style=\"padding: 24px; border-color: var(--bd-line);\">\n        <img src=\"fca233e5-50c5-4106-8c54-0779ca82954e\" alt=\"Dr. med. Evrim Oehmichen\" style=\"width: 100%; aspect-ratio: 1/1; border-radius: var(--r-md); object-fit: cover; object-position: center top; margin-bottom: 20px;\" loading=\"lazy\">\n        <h3 style=\"margin: 0 0 4px; font-size: 20px; font-weight: 500;\">Dr. med. Evrim Oehmichen<\u002Fh3>\n        <div style=\"font-size: 13px; color: var(--fg-3); margin-bottom: 12px;\">Ophthalmologist<\u002Fdiv>\n        <div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n          <span class=\"badge badge-line\" style=\"font-size: 11.5px; padding: 4px 8px;\">Dry eyes<\u002Fspan>\n          <span class=\"badge badge-line\" style=\"font-size: 11.5px; padding: 4px 8px;\">Glaucoma<\u002Fspan>\n          <span class=\"badge badge-line\" style=\"font-size: 11.5px; padding: 4px 8px;\">FEBO<\u002Fspan>\n          <span class=\"badge badge-line\" style=\"font-size: 11.5px; padding: 4px 8px;\">Telemedicine<\u002Fspan>\n          <span class=\"badge badge-sage\" style=\"font-size: 11.5px; padding: 4px 8px;\">English<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n        <h3 style=\"margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -0.01em;\">About<\u002Fh3>\n        <p style=\"margin: 0; color: var(--fg-2); font-size: 16px; line-height: 1.65;\">\n          Dr. med. Evrim Oehmichen is a licensed ophthalmologist in Germany and holds the <strong>FEBO<\u002Fstrong> (Fellow of the European Board of Ophthalmology) qualification.\n        <\u002Fp>\n        <p style=\"margin: 0; color: var(--fg-2); font-size: 16px; line-height: 1.65;\">\n          She founded <strong>Blickdoktor<\u002Fstrong> to provide patients with the fastest possible help for eye problems. Long waiting times at clinics and growing patient dissatisfaction led her to develop this digital solution.\n        <\u002Fp>\n        <p style=\"margin: 0; color: var(--fg-2); font-size: 16px; line-height: 1.65;\">\n          Her treatment approach is holistic: she considers not only physical complaints but also psychological and social aspects. A careful and thorough medical history forms the foundation of individualised care.\n        <\u002Fp>\n        <p style=\"margin: 0; color: var(--fg-2); font-size: 16px; line-height: 1.65;\">\n          Her goal is to ensure that every patient receives the right treatment, at the right time, in the right place.\n        <\u002Fp>\n        <div style=\"margin-top: 8px; padding: 20px 24px; background: var(--bd-blue-50); border-radius: var(--r-lg); border-left: 3px solid var(--bd-blue-700);\">\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center;\">\n            <span class=\"badge\" style=\"font-size: 12px; padding: 5px 10px;\">Ophthalmologist<\u002Fspan>\n            <span class=\"badge\" style=\"font-size: 12px; padding: 5px 10px;\">FEBO<\u002Fspan>\n            <span class=\"badge badge-sage\" style=\"font-size: 12px; padding: 5px 10px;\">Founder of Blickdoktor<\u002Fspan>\n nt-size: 13px; color: var(--fg-3);\">Assessment of an existing diagnosis<\u002Fspan><\u002Fdiv>\n          <span style=\"font-family: var(--font-display); font-size: 24px; letter-spacing: -0.01em; color: var(--bd-ink);\">37,54 \u20ac<\u002Fspan>\n        <\u002Fli>\n      <\u002Ful>\n      <div style=\"padding: 16px 28px; border-top: 1px solid var(--bd-line); background: var(--bd-bg-2); font-size: 13.5px; color: var(--fg-3);\">\n        Prescriptions and sick notes are included in the price when medically indicated (postal delivery only).\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\" style=\"padding: 96px 0;\">\n  <div style=\"max-width: var(--container); margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 64px; align-items: flex-start;\">\n    <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 640px; position: sticky; top: 96px;\">\n      <span style=\"font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3);\">FAQ<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; font-family: var(--font-display); font-weight: 500;\">Frequently asked questions.<\u002Fh2>\n      <p style=\"margin: 0; color: var(--fg-2); font-size: 17px; line-height: 1.5;\">Can\u2019t find your answer here? Write to us at <a href=\"mailto:kontakt@blickdoktor.de\">kontakt@blickdoktor.de<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top: 1px solid var(--bd-line);\">\n      <div style=\"border-bottom: 1px solid var(--bd-line); padding: 22px 0;\">\n        <div style=\"font-family: var(--font-display); font-size: 21px; letter-spacing: -0.01em; color: var(--fg-1); font-weight: 500;\">How quickly can I get an appointment?<\u002Fdiv>\n        <p style=\"margin: 10px 0 0; color: var(--fg-2); font-size: 15.5px; max-width: 560px;\">Typically you will receive a call back within minutes. For later appointments, you can choose from available time slots.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-bottom: 1px solid var(--bd-line); padding: 22px 0;\">\n        <div style=\"font-family: var(--font-display); font-size: 21px; letter-spacing: -0.01em; color: var(--fg-1); font-weight: 500;\">What does a consultation cost?<\u002Fdiv>\n        <p style=\"margin: 10px 0 0; color: var(--fg-2); font-size: 15.5px; max-width: 560px;\">Every consultation costs \u20ac37.54. You see the price before booking. The consultation is a self-pay service.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-bottom: 1px solid var(--bd-line); padding: 22px 0;\">\n        <div style=\"font-family: var(--font-display); font-size: 21px; letter-spacing: -0.01em; color: var(--fg-1); font-weight: 500;\">Can I get a prescription or sick note?<\u002Fdiv>\n        <p style=\"margin: 10px 0 0; color: var(--fg-2); font-size: 15.5px; max-width: 560px;\">Yes. When medically indicated, we issue prescriptions and sick notes. These are sent by post.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-bottom: 1px solid var(--bd-line); padding: 22px 0;\">\n        <div style=\"font-family: var(--font-display); font-size: 21px; letter-spacing: -0.01em; color: var(--fg-1); font-weight: 500;\">What if my concern is an emergency?<\u002Fdiv>\n        <p style=\"margin: 10px 0 0; color: var(--fg-2); font-size: 15.5px; max-width: 560px;\">For acute vision loss, severe pain, or injuries, please go to the nearest emergency room or call 112 immediately. We are not an emergency practice.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-bottom: 1px solid var(--bd-line); padding: 22px 0;\">\n        <div style=\"font-family: var(--font-display); font-size: 21px; letter-spacing: -0.01em; color: var(--fg-1); font-weight: 500;\">What technology do I need?<\u002Fdiv>\n        <p style=\"margin: 10px 0 0; color: var(--fg-2); font-size: 15.5px; max-width: 560px;\">No registration, no app
